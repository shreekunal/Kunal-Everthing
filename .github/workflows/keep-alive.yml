name: Render Keep-Alive (7 AM - 2 AM IST)

on:
  schedule:
    # 7:00 AM to 2:00 AM IST corresponds to ~01:00 to ~20:30 UTC
    # Runs every 14 minutes to prevent Render's 15-minute sleep timer
    - cron: '*/14 1-20 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping KunalOS
        run: |
          echo "Sending keep-alive ping to Render at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kunal-os.onrender.com/api/health)
          echo "HTTP Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Render instance is awake and healthy."
          else
            echo "Unexpected status $HTTP_STATUS (instance may be waking up)."
          fi
