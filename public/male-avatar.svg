<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="maleBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#1c1917" />
      <stop offset="60%" stopColor="#0c0a09" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>

    <!-- Red Rim Lighting -->
    <radialGradient id="redAura" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stopColor="#ef4444" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#ef4444" stopOpacity="0" />
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#27272a" />
      <stop offset="70%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#ef4444" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fef2f2" />
      <stop offset="100%" stopColor="#e4e4e7" />
    </linearGradient>

    <!-- Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#maleBg)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="60" cy="60" r="50" fill="url(#redAura)" />

  <!-- Jacket / Shoulders -->
  <path d="M22 115 C25 90, 40 82, 60 82 C80 82, 95 90, 98 115 Z" fill="url(#jacketGrad)" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Red Inner Collar Accent -->
  <path d="M46 84 L60 102 L74 84 L68 82 L60 92 L52 82 Z" fill="#ef4444" opacity="0.9" />

  <!-- T-shirt / V-neck -->
  <path d="M50 82 L60 94 L70 82 Z" fill="#18181b" />

  <!-- Neck -->
  <path d="M52 68 L52 83 L68 83 L68 68 Z" fill="#e4e4e7" />
  <path d="M52 74 C56 77, 64 77, 68 74 L68 83 L52 83 Z" fill="#d4d4d8" opacity="0.5" />

  <!-- Head / Jaw Silhouette -->
  <polygon points="40,42 80,42 77,65 60,78 43,65" fill="url(#skinGrad)" />

  <!-- Ears -->
  <ellipse cx="38" cy="52" rx="3.5" ry="6" fill="#e4e4e7" />
  <ellipse cx="82" cy="52" rx="3.5" ry="6" fill="#e4e4e7" />

  <!-- Modern Hair -->
  <path d="M36 43 C33 24, 52 16, 63 16 C76 16, 84 25, 83 40 C79 31, 70 27, 61 28 C50 29, 43 32, 36 43 Z" fill="url(#hairGrad)" />
  <!-- Hair Texture Strands -->
  <path d="M48 18 C56 16, 68 18, 74 24" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M52 23 C60 21, 68 23, 73 28" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <!-- Eyebrows -->
  <path d="M45 44 L54 43" stroke="#27272a" stroke-width="2.2" stroke-linecap="round" />
  <path d="M66 43 L75 44" stroke="#27272a" stroke-width="2.2" stroke-linecap="round" />

  <!-- Sleek Geometric Glasses (NothingOS Style) -->
  <rect x="43" y="47" width="13" height="9" rx="2.5" fill="#09090b" stroke="#ef4444" stroke-width="1.6" />
  <rect x="64" y="47" width="13" height="9" rx="2.5" fill="#09090b" stroke="#ef4444" stroke-width="1.6" />
  <line x1="56" y1="51" x2="64" y2="51" stroke="#ef4444" stroke-width="1.6" />
  <line x1="38" y1="50" x2="43" y2="50" stroke="#71717a" stroke-width="1.2" />
  <line x1="77" y1="50" x2="82" y2="50" stroke="#71717a" stroke-width="1.2" />

  <!-- Eyes behind glasses (glint) -->
  <circle cx="50" cy="51" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="71" cy="51" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Nose -->
  <path d="M60 55 L58 62 L62 62" stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Confident Smirk -->
  <path d="M54 67 Q60 70 66 67" stroke="#3f3f46" stroke-width="1.8" stroke-linecap="round" fill="none" />
</svg>
